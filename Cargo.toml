[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/secrets",
    "crates/tunnel",
    "crates/ssh",
    "crates/socks",
    "crates/shadowsocks",
    "crates/vless",
    "crates/tls",
    "crates/websocket",
    "crates/udpgw",
    "crates/dns",
    "crates/routing",
    "crates/nftables",
    "crates/tun",
    "crates/diagnostics",
    "services/privileged-helper",
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/perf",
]
default-members = [
    "crates/core",
    "crates/config",
    "crates/secrets",
    "crates/tunnel",
    "crates/ssh",
    "crates/socks",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Easy Connection Contributors"]
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
hex = "0.4"
parking_lot = "0.12"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "uuid"] }
russh = "0.49"
russh-keys = "0.49"
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
url = "2"
ipnet = { version = "2", features = ["serde"] }
futures = "0.3"
dashmap = "6"
libc = "0.2"
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
md5 = "0.7"

# Internal crates
rt-config = { path = "crates/config" }
rt-secrets = { path = "crates/secrets" }
rt-core = { path = "crates/core" }
rt-tunnel = { path = "crates/tunnel" }
rt-ssh = { path = "crates/ssh" }
rt-socks = { path = "crates/socks" }
rt-tls = { path = "crates/tls" }
rt-websocket = { path = "crates/websocket" }
rt-udpgw = { path = "crates/udpgw" }
rt-dns = { path = "crates/dns" }
rt-routing = { path = "crates/routing" }
rt-nftables = { path = "crates/nftables" }
rt-tun = { path = "crates/tun" }
rt-diagnostics = { path = "crates/diagnostics" }
rt-shadowsocks = { path = "crates/shadowsocks" }
rt-vless = { path = "crates/vless" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
